// Test fixture for both binding paths: generated into `src/gen/` as protoc-gen-es code and as a
// FileDescriptorSet. Deliberately not a realistic API — every interaction model, every field kind
// whose protobuf-JSON form is worth pinning down, and a few awkward names all appear at once.
// Run `pnpm run generate` after editing.

syntax = "proto3";

package test.gen.v1;

import "google/protobuf/any.proto";

enum Flavour {
  FLAVOUR_UNSPECIFIED = 0;
  FLAVOUR_PLAIN = 1;
  FLAVOUR_SALTED = 2;
}

message Nested {
  string label = 1;
}

message Ping {
  string value = 1;
  // Deliberately snake_case: protobuf-JSON carries the deduced `sentAtMillis` instead, and int64
  // crosses the wire as a string.
  int64 sent_at_millis = 2;
  Flavour flavour = 3;
  repeated Nested nested = 4;
  map<string, string> extra = 5;
}

message Pong {
  string value = 1;
  Flavour flavour = 2;
  repeated Nested nested = 3;
  map<string, string> extra = 4;
}

// `google.protobuf.Any` in every position a field can take: decoding one needs its type in the
// registry, and `keepUnresolvedAny` must keep the message decodable when it is not.
message Envelope {
  string id = 1;
  google.protobuf.Any payload = 2;
  repeated google.protobuf.Any extra = 3;
  map<string, google.protobuf.Any> attachments = 4;
  oneof content {
    google.protobuf.Any boxed = 5;
    string text = 6;
  }
  Envelope inner = 7;
}

service EnvelopeService {
  rpc Fetch(Ping) returns (Envelope);
}

// Every interaction model the dxLink wire can carry.
service TestService {
  rpc Unary(Ping) returns (Pong);
  rpc ServerStream(Ping) returns (stream Pong);
  rpc BidiStream(stream Ping) returns (stream Pong);
}

// A service the wire can carry only in part: `Collect` is client-streaming, which dxLink v1.0
// cannot express, and binding it must either throw or be skipped.
service MixedService {
  rpc Echo(Ping) returns (Pong);
  rpc Collect(stream Ping) returns (Pong);
}

// Method names that do not survive a naive lowercase-the-first-letter: the client is keyed by the
// ECMAScript local name protoc-gen-es assigns, while the channel carries the proto name.
service NamingService {
  rpc RPCPing(Ping) returns (Pong);
  rpc ping_pong(Ping) returns (Pong);
}
