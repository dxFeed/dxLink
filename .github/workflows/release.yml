name: Release

# npm auth is Trusted Publishing: no NPM_TOKEN, npm verifies this workflow's OIDC claim instead.
# Hence `id-token: write`, and publishing through the npm CLI — pnpm 11.8 cannot do the exchange.
#
# A trusted publisher can only be attached to a package that already exists, so a package whose
# first version has never been published must go out by hand once before this can release it.
# `main` must also accept pushes from github-actions[bot].
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Version and verify, but do not push, publish or tag'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: dxlink-javascript

env:
  # `changeset version` rewrites every package.json, which makes pnpm consider node_modules stale;
  # every later pnpm command would then "repair" it with a full, unfiltered install and reach for
  # the @dxscript packages this job deliberately skipped. Turn that auto-install off.
  pnpm_config_verify_deps_before_run: 'false'

  # Both pull @dxscript/* from the internal Nexus, which GitHub-hosted runners cannot reach.
  # dxscript is still versioned by changesets; it just has to be published from inside the network.
  PNPM_FILTER: >-
    --filter=!@dxfeed/dxlink-console-dxscript
    --filter=!@dxfeed/dxlink-debug-console

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # The workspace is not at the repo root, and `defaults.run.working-directory`
          # does not apply to actions — so the packageManager field has to be pointed at.
          package_json_file: dxlink-javascript/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dxlink-javascript/pnpm-lock.yaml

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Decide whether to version or resume
        id: mode
        # With pending changesets this is a new release. Without them, the last release may have
        # failed after its version bump was pushed: resume it (publish, tag, GitHub Release) if its
        # tag is still missing, so a half-published release can be finished by running this again.
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./dxlink-core/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::No pending changesets in .changeset and v$version is already tagged — nothing to release."
            exit 1
          fi
          # Publish and tag exactly what was versioned: later commits must not go out under this version.
          release_commit=$(git log -1 --format=%H --grep="^chore(release): v$version\$")
          if [ -z "$release_commit" ]; then
            echo "::error::v$version is untagged, but its 'chore(release): v$version' commit is not on ${{ github.ref_name }}."
            exit 1
          fi
          git checkout --detach "$release_commit"
          echo "::notice::No pending changesets; resuming the unfinished release v$version."
          echo "mode=resume" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile $PNPM_FILTER

      - name: Fail if a package has never been published
        # Trusted Publishing can only be attached to a package that already exists on npm, so a new
        # package would fail mid-publish — after the version bump is pushed and other packages are out.
        run: |
          missing=$(pnpm ls -r --depth -1 --json $PNPM_FILTER \
            | node -e '
              const pkgs = JSON.parse(require("fs").readFileSync(0, "utf8"));
              for (const p of pkgs) if (!p.private) console.log(p.name);
            ' \
            | while read -r name; do
                if npm view "$name" name 2>&1 | grep -q E404; then echo "$name"; fi
              done)
          if [ -n "$missing" ]; then
            for name in $missing; do
              echo "::error::$name has never been published to npm. Publish its first version by hand and add this workflow as its trusted publisher."
            done
            exit 1
          fi

      - name: Apply changesets
        if: ${{ steps.mode.outputs.mode == 'new' }}
        run: pnpm changeset version

      - name: Read released version
        id: version
        # One `fixed` group in .changeset/config.json, so any package reports the release version.
        run: echo "version=$(node -p "require('./dxlink-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build, test and lint
        run: pnpm turbo run build test lint $PNPM_FILTER

      - name: Commit and push version bump
        if: ${{ !inputs.dry_run && steps.mode.outputs.mode == 'new' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): v${{ steps.version.outputs.version }}'
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish to npm
        # `pnpm -r exec` walks the workspace in topological order.
        # Packages already on npm at this version are skipped, so a resumed release only publishes the rest.
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: pnpm -r $PNPM_FILTER exec bash "$GITHUB_WORKSPACE/.github/scripts/publish-package.sh"

      - name: Collect release notes
        run: |
          pnpm ls -r --depth -1 --json $PNPM_FILTER \
            | node "$GITHUB_WORKSPACE/.github/scripts/release-notes.mjs" '${{ steps.version.outputs.version }}' \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Tag the release
        # Annotated tag on the release commit, carrying the release notes as its message.
        if: ${{ !inputs.dry_run }}
        run: |
          tag='v${{ steps.version.outputs.version }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "skip $tag — already tagged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          { echo "$tag"; echo; cat "$RUNNER_TEMP/release-notes.md"; } > "$RUNNER_TEMP/tag-message.md"
          git tag -a "$tag" --cleanup=verbatim -F "$RUNNER_TEMP/tag-message.md"
          git push origin "$tag"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='v${{ steps.version.outputs.version }}'
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "skip GitHub Release $tag — already exists"
            exit 0
          fi
          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --repo '${{ github.repository }}'
